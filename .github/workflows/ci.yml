name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Analisar o código
        run: npm run lint

      - name: Rodar os testes
        run: npm test

      # O build não precisa das chaves do Supabase: elas são lidas em tempo de
      # execução, no navegador, a partir das variáveis configuradas na Vercel.
      - name: Compilar para produção
        run: npm run build
